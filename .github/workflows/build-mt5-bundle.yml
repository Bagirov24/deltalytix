name: Build MT5 deploy bundle

on:
  push:
    branches:
      - chatgpt/mt5-bundle
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore MT5 integration
        shell: bash
        run: |
          cat .mt5_bundle/part_*.b64 | base64 -d > mt5_payload.zip
          unzip -o mt5_payload.zip -d .
          rm -rf .mt5_bundle mt5_payload.zip
          rm -rf .git
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type d -name '.pytest_cache' -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

      - name: Upload unified source bundle
        uses: actions/upload-artifact@v4
        with:
          name: deltalytix-mt5-deploy
          path: .
          include-hidden-files: true
          retention-days: 7
